# Installer source configuration — plain KEY=VALUE (read by install.sh AND install.ps1; no shell code here).
# Pinned versions. Changing a pin = a reviewed upgrade (IT policy: pinned version, auto-update off).

MITMPROXY_VERSION=12.2.3

# IT's internal mirror base URL (no trailing slash). Empty until IT publishes it; then it becomes the default.
# Layout expected under it — see mirror/README.md:
#   $MIRROR_BASE_URL/mitmproxy/<version>/<official file name>
#   $MIRROR_BASE_URL/<cli>/<cli>-<tool version>.tar.gz
MIRROR_BASE_URL=

# mitmproxy 12.2.3 — official file names and SHA-256 (verified 2026-10-14 from Homebrew cask API and winget manifest).
# Reuse an already-installed mitmproxy (e.g. Homebrew cask) only if its app signature verifies against this team.
MITMPROXY_TEAM_ID=S8XHQB96PW
# Windows: Authenticode signer subject to accept for an external mitmdump.exe (empty = never reuse an external copy).
MITMPROXY_WINDOWS_SIGNER=

MITMPROXY_FILE_MACOS_ARM64=mitmproxy-12.2.3-macos-arm64.tar.gz
MITMPROXY_SHA256_MACOS_ARM64=0a09ee3b82569e8985aff8186e4792618b8e5d0c766098db093d09a87d4b013a
MITMPROXY_FILE_MACOS_X86_64=mitmproxy-12.2.3-macos-x86_64.tar.gz
MITMPROXY_SHA256_MACOS_X86_64=7998187f5a0d399ab796af4523d3ad830ebe690726a41bc3e1df47a8e477a641

# Windows: the portable zip is what install.ps1 uses (user-scope, no admin). Its SHA-256 could NOT be confirmed from
# any source reachable on 2026-10-14 (downloads.mitmproxy.org is blocked on the corporate network). IT must compute it
# from the file they mirror (Get-FileHash / shasum -a 256) and paste it here; until then install.ps1 refuses.
MITMPROXY_FILE_WINDOWS_X86_64=mitmproxy-12.2.3-windows-x86_64.zip
MITMPROXY_SHA256_WINDOWS_X86_64=

# Our tool (the versioned tarball made by mirror/make-release.sh). Pin printed by make-release.sh.
TOOL_SHA256=
